name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed

jobs:
  cd:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build

      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx vercel --prod --yes --token $VERCEL_TOKEN

      - name: Smoke Tests
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          FAILED=0

          echo "Checking website..."
          if ! curl -f https://mmeletricarservice.it/ ; then
            echo "Website unreachable."
            FAILED=1
          fi

          echo "Checking Used Cars Overview API..."
          OVERVIEW_RESPONSE=$(curl -s https://mmeletricarservice.it/api/used-cars-overview/usedCarsOverview)
          if [ -z "$OVERVIEW_RESPONSE" ]; then
            echo "Used Cars Overview API failed."
            FAILED=1
          else
            FIRST_ID=$(echo $OVERVIEW_RESPONSE | jq -r '.used_cars_overview[0].id // empty')
            if [ -n "$FIRST_ID" ]; then
              echo "Checking Used Car Info API for id=$FIRST_ID..."
              if ! curl -f "https://mmeletricarservice.it/api/used-car-info/usedCarInfo?id=$FIRST_ID" ; then
                echo "Used Car Info API failed."
                FAILED=1
              fi
            fi
          fi

          if [ $FAILED -eq 1 ]; then
            echo "One or more smoke tests failed, rolling back..."
            PREV_DEPLOY=$(npx vercel list --token $VERCEL_TOKEN --prod --limit 2 | tail -n1 | awk '{print $1}')
            npx vercel rollback $PREV_DEPLOY --token $VERCEL_TOKEN
            exit 1
          fi

          echo "All smoke tests passed."

      - name: Install Lighthouse CI
        run: npm install -g @lhci/cli

      - name: Run Lighthouse CI
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          FAILED=0

          lhci autorun --collect.url=https://mmeletricarservice.it || FAILED=1

          if [ $FAILED -eq 1 ]; then
            echo "Lighthouse assertions failed, rolling back..."
            PREV_DEPLOY=$(npx vercel list --token $VERCEL_TOKEN --prod --limit 2 | tail -n1 | awk '{print $1}')
            npx vercel rollback $PREV_DEPLOY --token $VERCEL_TOKEN
            exit 1
          fi
