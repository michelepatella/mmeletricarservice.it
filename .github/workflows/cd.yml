# Continuous Delivery (CD): Manage reliable deployment of
# the project to Vercel, ensuring that changes are automatically
# built and safely deployed after successful CI runs
name: Continuous Delivery (CD)

# Run the workflow only after successful CI run
on:
  workflow_run:
    workflows: ["Continuous Integration (CI)"]
    types: [completed]
    branches: [main]

# The workflow is organized into a single job:
# - Deploy:
#     Build the project and deploy the built output to Vercel.
jobs:
  # ----------------------------------------------------------------------
  # Deploy
  # ----------------------------------------------------------------------
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      # ------------------------------------------------------------------
      # Checkout repository
      # ------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------------------------------------
      # Setup Node.js environment
      # ------------------------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ vars.NODE_VERSION }}
          cache: npm

      # ------------------------------------------------------------------
      # Install dependencies
      # ------------------------------------------------------------------
      - name: Install dependencies
        run: npm ci

      # ------------------------------------------------------------------
      # Build project
      # ------------------------------------------------------------------
      - name: Build project
        run: npm run build

      # ------------------------------------------------------------------
      # Deploy to Vercel (prebuilt)
      # ------------------------------------------------------------------
      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_NAME: ${{ secrets.VERCEL_PROJECT_NAME }}
          VERCEL_TEAM: ${{ secrets.VERCEL_TEAM }}
        run: |
          npx vercel --prod --yes \
            --token $VERCEL_TOKEN --confirm \
            --name $VERCEL_PROJECT_NAME \
            --scope $VERCEL_TEAM
