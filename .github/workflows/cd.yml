# Continuous Delivery (CD): Manage reliable deployment of
# the project to Vercel, ensuring that changes are automatically
# built and safely deployed after successful CI runs
name: Continuous Delivery (CD)

# Run the workflow only after successful CI run
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

# The workflow is organized into three jobs:
# - Setup:
#     Checkout the repository, set up Node.js, and install dependencies.
# - Build (needs 'Setup'):
#     Build the project to generate production-ready artifacts.
# - Deploy (needs 'Build'):
#     Deploy the built project to Vercel.
jobs:
  # ----------------------------------------------------------------------
  # Setup
  # ----------------------------------------------------------------------
  setup:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      # Checkout the repository on the current branch
      - name: Checkout repository
        uses: actions/checkout@v3

      # Setup Node.js environment
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ vars.NODE_VERSION }}

      # Install dependencies
      - name: Install dependencies
        run: npm install

  # ----------------------------------------------------------------------
  # Build (needs 'Setup')
  # ----------------------------------------------------------------------
  build:
    runs-on: ubuntu-latest
    needs: setup
    steps:
      # Build the project
      - name: Build project
        run: npm run build

  # ----------------------------------------------------------------------
  # Deploy (needs 'Build')
  # ----------------------------------------------------------------------
  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      # Deploy to Vercel using the Vercel CLI
      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_NAME: ${{ secrets.VERCEL_PROJECT_NAME }}
          VERCEL_TEAM: ${{ secrets.VERCEL_TEAM }}
        run: |
          npx vercel --prod --yes \
            --token $VERCEL_TOKEN \
            --confirm \
            --name $VERCEL_PROJECT_NAME \
            --scope $VERCEL_TEAM
