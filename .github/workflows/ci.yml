# Continuous Integration (CI): Automate linting, formatting, testing,
# security scans, build, and static analysis, ensuring
# code quality and security
name: Continuous Integration (CI)

# Cancel any in-progress workflow if a new one is triggered
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Trigger workflow on pushes and pull requests to main
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# The workflow is organized into five jobs:
# - Linting and Formatting:
#     Run ESLint and Prettier to ensure code style and formatting compliance.
# - Testing:
#     Run automated tests to validate code.
# - Security Scan:
#     Audit dependencies for vulnerabilities using npm audit.
# - Build (needs 'Linting and Formatting', 'Testing', and 'Security Scan'):
#     Build the project only if linting, tests, and security checks pass.
# - Static Analysis (needs 'Build'):
#     Run SonarQube analysis to check code quality.
jobs:
  # ----------------------------------------------------------------------
  # Linting and Formatting
  # ----------------------------------------------------------------------
  linting_formatting:
    runs-on: ubuntu-latest
    steps:
      # Checkout the repository on the current branch
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: ${{ vars.SONAR_FETCH_DEPTH }}

      # Setup Node.js environment
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ vars.NODE_VERSION }}
          cache: npm

      # Install dependencies
      - name: Install dependencies
        run: npm ci

      # Run code linting and formatting checks
      - name: Run linting and formatting checks
        run: npm run code:check

  # ----------------------------------------------------------------------
  # Testing
  # ----------------------------------------------------------------------
  testing:
    runs-on: ubuntu-latest
    steps:
      # Checkout the repository on the current branch
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: ${{ vars.SONAR_FETCH_DEPTH }}

      # Setup Node.js environment
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ vars.NODE_VERSION }}
          cache: npm

      # Install dependencies
      - name: Install dependencies
        run: npm ci
      
      # Run project tests
      - name: Run tests
        run: npm run test -- --watchAll=${{ vars.TEST_WATCH_ALL }}

  # ----------------------------------------------------------------------
  # Security Scan
  # ----------------------------------------------------------------------
  security_scan:
    runs-on: ubuntu-latest
    steps:
      # Checkout the repository on the current branch
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: ${{ vars.SONAR_FETCH_DEPTH }}

      # Setup Node.js environment
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ vars.NODE_VERSION }}
          cache: npm

      # Install dependencies
      - name: Install dependencies
        run: npm ci

      # Audit npm dependencies for vulnerabilities
      - name: Run security scan
        run: npm audit --audit-level=${{ vars.AUDIT_LEVEL }}

  # ----------------------------------------------------------------------
  # Build (needs 'Linting and Formatting', 'Testing', and 'Security Scan')
  # ----------------------------------------------------------------------
  build:
    runs-on: ubuntu-latest
    needs: [linting_formatting, testing, security_scan]
    steps:
      # Checkout the repository on the current branch
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: ${{ vars.SONAR_FETCH_DEPTH }}

      # Setup Node.js environment
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ vars.NODE_VERSION }}
          cache: npm

      # Install dependencies
      - name: Install dependencies
        run: npm ci

      # Build the project
      - name: Build project
        run: npm run build

  # ----------------------------------------------------------------------
  # Static Analysis (needs 'Build')
  # ----------------------------------------------------------------------
  static_analysis:
    runs-on: ubuntu-latest
    needs: build
    steps:
      # Checkout the repository on the current branch
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: ${{ vars.SONAR_FETCH_DEPTH }}

      # Setup Node.js environment
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ vars.NODE_VERSION }}
          cache: npm

      # Install dependencies
      - name: Install dependencies
        run: npm ci

      # Run SonarQube analysis for code quality
      - name: Run static analysis
        uses: SonarSource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY }}
            -Dsonar.organization=${{ secrets.SONAR_ORGANIZATION }}
            -Dsonar.sources=${{ vars.SONAR_SOURCES }}
            -Dsonar.qualitygate.wait=${{ vars.SONAR_QUALITY_GATE_WAIT }}
